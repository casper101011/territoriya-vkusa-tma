<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Территория Вкуса — Telegram Mini App</title>
    
    <!-- Подключение шрифтов Montserrat & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --primary-yellow: #FFDD00;
            --bg-black: #111111;
            --bg-btn-dark: #000000;
            --text-white: #FFFFFF;
            --text-gray: #A0A0A0;
            --border-color: #2A2A2A;
            --font-heading: 'Montserrat', -apple-system, sans-serif;
            --font-body: 'Inter', -apple-system, sans-serif;
            --radius-btn: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.4;
            user-select: none;
            /* Легкий фоновый паттерн/текстура (имитация темного фона со скриншота) */
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 221, 0, 0.05) 0%, transparent 50%);
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 30px 20px 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка */
        .header-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--primary-yellow);
            margin-bottom: 12px;
        }

        .brand-titles h1 {
            font-family: var(--font-heading);
            font-size: 20px;
            color: var(--primary-yellow);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 4px;
        }

        .brand-titles p {
            font-size: 13px;
            color: var(--text-white);
            font-weight: 500;
        }

        /* Основные кнопки-ссылки */
        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .link-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 54px;
            background-color: var(--bg-btn-dark);
            border-radius: var(--radius-btn);
            text-decoration: none;
            color: var(--primary-yellow);
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.1s ease;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .link-btn:active {
            transform: scale(0.98);
        }

        .link-btn span.subtitle {
            font-size: 11px;
            color: var(--text-gray);
            font-weight: 400;
            margin-top: 2px;
        }

        /* Секция магазинов */
        .section-title {
            font-family: var(--font-heading);
            font-size: 16px;
            color: var(--primary-yellow);
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
        }

        .stores-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .store-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Кнопка локации (Желтая) */
        .btn-location {
            display: flex;
            align-items: center;
            width: 100%;
            background-color: var(--primary-yellow);
            border-radius: var(--radius-btn);
            text-decoration: none;
            color: #000000;
            padding: 12px 20px;
            transition: transform 0.1s ease;
            border: none;
            cursor: pointer;
            text-align: left;
        }

        .btn-location:active {
            transform: scale(0.98);
        }

        .btn-location i {
            margin-right: 16px;
            flex-shrink: 0;
            width: 24px;
            height: 24px;
        }

        .btn-location-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-location-content strong {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
        }

        .btn-location-content span {
            font-size: 11px;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.6);
            margin-top: 2px;
        }

        /* Кнопка телефона (Черная) */
        .btn-phone {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background-color: var(--bg-btn-dark);
            border-radius: var(--radius-btn);
            text-decoration: none;
            color: var(--text-white);
            font-weight: 600;
            font-size: 14px;
            padding: 14px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.1s ease;
        }

        .btn-phone:active {
            transform: scale(0.98);
        }

        .btn-phone i {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            color: var(--text-gray);
        }

        /* Разделитель (галочка) как в дизайне */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-yellow);
            margin-top: 8px;
            opacity: 0.5;
        }
        
        .divider i {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Шапка -->
        <header class="header-brand">
            <img src="assets/logo.png" alt="Территория Вкуса" class="brand-logo" onerror="this.src='https://p.taplink.st/a/c/2/4/c/db37b1.png?1'">
            <div class="brand-titles">
                <h1>Территория Вкуса</h1>
                <p>Мясные деликатесы в Ташкенте</p>
            </div>
        </header>

        <!-- Главные ссылки -->
        <div class="links-group">
            <a href="http://t.me/tasin_sharaev" class="link-btn" onclick="openLink(event, this.href)">
                Заказать доставку
                <span class="subtitle">Написать в Телеграм</span>
            </a>
            <a href="tel:+998946867117" class="link-btn">
                Позвонить
            </a>
            <a href="https://www.instagram.com/territoriavkusa.uz/" class="link-btn" onclick="openLink(event, this.href)">
                Instagram
            </a>
            <a href="https://t.me/territoriavkusa" class="link-btn" onclick="openLink(event, this.href)">
                Телеграм канал
            </a>
        </div>

        <!-- Секция Магазинов -->
        <h2 class="section-title">Наши Магазины</h2>
        
        <div class="stores-list">
            
            <!-- 1. Юнусабадский базар -->
            <div class="store-block">
                <button class="btn-location" onclick="openLink(event, 'https://yandex.uz/maps/-/CPaXaDox')">
                    <i data-lucide="map-pin"></i>
                    <div class="btn-location-content">
                        <strong>Локация — Юнусабадский базар</strong>
                        <span>Мясо-молочный павильон</span>
                    </div>
                </button>
                <a href="tel:+998954743050" class="btn-phone">
                    <i data-lucide="phone-call"></i> Позвонить
                </a>
                <div class="divider"><i data-lucide="chevron-down"></i></div>
            </div>

            <!-- 2. Буз базар -->
            <div class="store-block">
                <button class="btn-location" onclick="openLink(event, 'https://yandex.uz/maps/-/CPaXeE4I')">
                    <i data-lucide="map-pin"></i>
                    <div class="btn-location-content">
                        <strong>Локация — Буз базар</strong>
                        <span>М. Максим Горький</span>
                    </div>
                </button>
                <a href="tel:+998900221052" class="btn-phone">
                    <i data-lucide="phone-call"></i> Позвонить
                </a>
                <div class="divider"><i data-lucide="chevron-down"></i></div>
            </div>

            <!-- 3. Рынок Катартал -->
            <div class="store-block">
                <button class="btn-location" onclick="openLink(event, 'https://yandex.uz/maps/-/CPaXeQJa')">
                    <i data-lucide="map-pin"></i>
                    <div class="btn-location-content">
                        <strong>Локация — Рынок Катартал</strong>
                        <span>Магазин №43</span>
                    </div>
                </button>
                <a href="tel:+998911354928" class="btn-phone">
                    <i data-lucide="phone-call"></i> Позвонить
                </a>
                <div class="divider"><i data-lucide="chevron-down"></i></div>
            </div>

            <!-- 4. Аския -->
            <div class="store-block">
                <button class="btn-location" onclick="openLink(event, 'https://yandex.uz/maps/-/CPaXaDjr')">
                    <i data-lucide="map-pin"></i>
                    <div class="btn-location-content">
                        <strong>Локация — Аския</strong>
                        <span>Шота Руставели</span>
                    </div>
                </button>
                <a href="tel:+998901749924" class="btn-phone">
                    <i data-lucide="phone-call"></i> Позвонить
                </a>
                <div class="divider"><i data-lucide="chevron-down"></i></div>
            </div>

            <!-- 5. Гагарин -->
            <div class="store-block">
                <button class="btn-location" onclick="openLink(event, 'https://yandex.uz/maps/-/CPePaL3l')">
                    <i data-lucide="map-pin"></i>
                    <div class="btn-location-content">
                        <strong>Локация — Гагарин</strong>
                        <span>Чиланзар, Аллея Гагарина</span>
                    </div>
                </button>
                <a href="tel:+998977581849" class="btn-phone">
                    <i data-lucide="phone-call"></i> Позвонить
                </a>
                <div class="divider"><i data-lucide="chevron-down"></i></div>
            </div>

            <!-- 6. Сергели -->
            <div class="store-block">
                <button class="btn-location" onclick="openLink(event, 'https://yandex.uz/maps/-/CPgweP1I')">
                    <i data-lucide="map-pin"></i>
                    <div class="btn-location-content">
                        <strong>Локация — Сергели</strong>
                        <span>улица Мехригиё, 13 (напротив Дехкан базара)</span>
                    </div>
                </button>
                <a href="tel:+998977764640" class="btn-phone">
                    <i data-lucide="phone-call"></i> Позвонить
                </a>
            </div>

        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            // Устанавливаем цвета хедера и фона под дизайн
            tg.setHeaderColor('#111111');
            tg.setBackgroundColor('#111111');
        }

        // Инициализация иконок Lucide
        lucide.createIcons();

        // Функция открытия внешних ссылок (Яндекс Карты, Инстаграм, Телеграм)
        function openLink(event, url) {
            event.preventDefault(); // Останавливаем стандартный переход
            if (tg && tg.openLink) {
                // Если открыто внутри Telegram, используем нативный метод
                tg.openLink(url);
            } else {
                // Фоллбэк для обычного браузера
                window.open(url, '_blank');
            }
        }
    </script>
</body>
</html>
