<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы</title>
    <!-- Подключаем Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .form-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 15px; background: #2678b6; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <h2>Оставить отзыв</h2>
    <input type="text" id="fb-name" class="form-input" placeholder="Введите ваше имя" required>
    <input type="tel" id="fb-phone" class="form-input" placeholder="Введите номер телефона">
    <textarea id="fb-msg" class="form-input" rows="4" placeholder="Ваш отзыв"></textarea>
    <button class="submit-btn" onclick="sendFeedback()">Отправить отзыв</button>

    <script>
        // Инициализация Telegram
        let tg = window.Telegram.WebApp;
        tg.expand();

        async function sendFeedback() {
            // 1. Получаем данные
            const name = document.getElementById('fb-name').value;
            const phone = document.getElementById('fb-phone').value;
            const message = document.getElementById('fb-msg').value;

            // --- ВСТАВЬ СЮДА СВОЙ URL ИЗ MAKE ---
            const webhookUrl = 'ВСТАВЬ_СЮДА_URL_ИЗ_MAKE'; 
            // ------------------------------------

            if (!name) {
                alert('Пожалуйста, введите имя!');
                return;
            }

            const payload = {
                name: name,
                phone: phone || 'Не указан',
                message: message || 'Без текста',
                date: new Date().toLocaleString('ru-RU')
            };

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('Спасибо! Ваш отзыв отправлен.');
                    document.getElementById('fb-name').value = '';
                    document.getElementById('fb-phone').value = '';
                    document.getElementById('fb-msg').value = '';
                } else {
                    alert('Ошибка отправки. Проверьте URL.');
                }
            } catch (error) {
                alert('Ошибка соединения.');
            }
        }
    </script>
</body>
</html>
